<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4F46E5">
  <meta name="description" content="Entre na sua conta do Active Vida Leve.">
  <title>Entrar | Active Vida Leve</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./assets/css/global.css">
  <link rel="stylesheet" href="./assets/css/login.css">
</head>
<body class="login-page">
  <header class="login-header">
    <div class="container login-header-inner">
      <a class="login-brand" href="./index.html" aria-label="Active Vida Leve">
        <img src="./assets/images/logo/active-vida-leve-horizontal.png" alt="Active Vida Leve" width="760" height="198">
      </a>
      <div class="login-header-actions">
        <span>Ainda não tem uma conta?</span>
        <a class="btn btn-small login-signup-link" href="./cadastro.html">Cadastro</a>
      </div>
    </div>
  </header>

  <main class="login-main">
    <div class="container login-layout">
      <section class="login-card" aria-labelledby="login-card-title">
        <div class="login-card-heading login-card-heading-hero">
          <picture class="login-card-heading-media" aria-hidden="true">
            <source media="(max-width: 900px)" srcset="./assets/images/login/login-hero-mobile.webp">
            <img src="./assets/images/login/login-hero-desktop.webp" alt="" loading="eager" decoding="async">
          </picture>
          <div class="login-card-heading-copy">
            <span>ACESSAR MINHA CONTA</span>
            <h2 id="login-card-title">Entrar no Active Vida Leve</h2>
            <p>Escolha uma das opções abaixo para continuar.</p>
          </div>
        </div>

        <button class="login-google" type="button" data-login-google>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.23-.2-1.78H12v3.42h5.52a4.77 4.77 0 0 1-2.05 3.04l-.02.11 2.98 2.31.21.02c1.92-1.77 2.96-4.38 2.96-7.12Z"/>
            <path fill="#34A853" d="M12 22c2.7 0 4.96-.89 6.62-2.43l-3.17-2.44c-.85.58-2 .98-3.45.98-2.6 0-4.8-1.76-5.59-4.19l-.1.01-3.1 2.4-.04.09A10 10 0 0 0 12 22Z"/>
            <path fill="#FBBC05" d="M6.41 13.92A6 6 0 0 1 6.08 12c0-.67.12-1.32.32-1.92l-.01-.13-3.14-2.44-.1.05A10 10 0 0 0 2 12c0 1.6.38 3.12 1.17 4.44l3.24-2.52Z"/>
            <path fill="#EA4335" d="M12 5.89c1.88 0 3.15.81 3.88 1.48l2.8-2.73C16.96 3.03 14.7 2 12 2a10 10 0 0 0-8.83 5.56l3.23 2.52C7.2 7.65 9.4 5.9 12 5.9Z"/>
          </svg>
          <span>Continuar com Google</span>
        </button>

        <div class="login-divider"><span>ou use seu e-mail ou celular</span></div>

        <div class="login-method-switch" role="group" aria-label="Escolha como entrar">
          <button class="is-active" type="button" data-login-mode="email" aria-pressed="true">E-mail</button>
          <button type="button" data-login-mode="phone" aria-pressed="false">Celular</button>
        </div>

        <form class="login-form" data-login-form novalidate>
          <label class="login-field">
            <span data-login-identifier-label>E-mail</span>
            <input type="email" name="email" autocomplete="email" placeholder="voce@exemplo.com" required data-login-identifier>
            <small class="login-field-error" data-error-for="email"></small>
          </label>

          <label class="login-field" data-password-field>
            <span>Senha</span>
            <div class="login-password-wrap">
              <input type="password" name="senha" autocomplete="current-password" placeholder="Digite sua senha" required>
              <button class="login-password-toggle" type="button" data-password-toggle aria-label="Mostrar senha">Mostrar</button>
            </div>
            <small class="login-field-error" data-error-for="senha"></small>
          </label>

          <div class="login-form-row" data-email-options>
            <label class="login-remember">
              <input type="checkbox" name="lembrar" checked>
              <span>Manter conectado</span>
            </label>
            <button class="login-forgot" type="button" data-forgot-password>Esqueci minha senha</button>
          </div>

          <button class="login-submit" type="submit" data-login-submit>Entrar</button>
          <div class="login-status" data-login-status hidden role="status" aria-live="polite"></div>
        </form>

        <div class="login-account-note">
          <span>Novo por aqui?</span>
          <a class="login-account-link" href="./cadastro.html">Criar minha conta</a>
        </div>
      </section>
    </div>
  </main>

  <footer class="login-footer">
    <div class="container login-footer-inner">
      <p>© 2026 Active Vida Leve.</p>
      <a class="login-home-btn" href="./index.html">Voltar para o início</a>
    </div>
  </footer>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
